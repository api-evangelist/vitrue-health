aid: vitrue-health
name: Vitrue Health
description: Vitrue Health is a London-based, Techstars-backed digital health company
  providing an AI-powered musculoskeletal (MSK) and workplace ergonomics platform.
  Its VIDA product uses camera-based AI assessments to automate Display Screen Equipment
  (DSE) compliance, deliver personalized pain-management pathways, and give employers
  analytics through a VIDA Co-Pilot dashboard, reporting an average 34% reduction in
  MSK pain. The platform integrates with HR systems, learning management systems, and
  SSO/provisioning identity providers, but does not publish a public developer API,
  SDK, or API documentation.
